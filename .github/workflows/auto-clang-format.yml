name: auto-clang-format
on: [pull_request, push]

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: DoozyX/clang-format-lint-action@v0.20
      with:
        source: './Source/Runtime ./Source/Tools ./Examples'
        exclude: ''
        # clang-format treats HLSL/Slang stage attributes as C++ expressions and joins entry declarations.
        extensions: 'h,hpp,c,cpp'
        clangFormatVersion: 20
        inplace: True
    - uses: EndBug/add-and-commit@v9
      with:
        author_name: Clang-Format
        author_email: Clang-Format
        message: 'Clang-Format'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
