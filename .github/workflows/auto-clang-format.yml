name: auto-clang-format
on: [pull_request, push]

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install clang-format
      run: python -m pip install clang-format==20.1.3
    - name: Format changed C and C++ lines
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
          BASE_SHA=$(git rev-parse HEAD^)
        fi
        # Do not reintroduce changes when undoing an automatic formatting commit.
        while [[ "$(git show -s --format=%s "$BASE_SHA")" == "Clang-Format" ]]; do
          BASE_SHA=$(git rev-parse "$BASE_SHA^")
        done
        # Slang/HLSL stage attributes are not parsed correctly by clang-format.
        # git-clang-format returns 1 after successfully applying formatting changes.
        git clang-format --binary clang-format --extensions c,h,cpp,hpp "$BASE_SHA" -- Source/Runtime Source/Tools Examples || test "$?" -eq 1
    - uses: EndBug/add-and-commit@v9
      with:
        author_name: Clang-Format
        author_email: Clang-Format
        message: 'Clang-Format'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
