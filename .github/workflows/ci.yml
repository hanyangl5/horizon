name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, main_deprecated]

env:
  VULKAN_SDK_VERSION: "1.3.296.0"
  ANDROID_NDK_VERSION: "27.2.12479018"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: android_dev
            os: ubuntu-latest
          - preset: windows_dev
            os: windows-2022
          - preset: macos_dev
            os: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      # ============================================================
      # Android dependencies (ubuntu runners only)
      # ============================================================
      - name: Set up JDK 17
        if: startsWith(matrix.preset, 'android')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK / NDK
        if: startsWith(matrix.preset, 'android')
        shell: bash
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;${{ env.ANDROID_NDK_VERSION }}" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> "$GITHUB_ENV"

      # ============================================================
      # Windows dependencies
      # ============================================================
      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ env.VULKAN_SDK_VERSION }}"
          $url = "https://sdk.lunarg.com/sdk/download/${ver}/windows/VulkanSDK-${ver}-Installer.exe"
          Write-Host "Downloading Vulkan SDK ${ver} ..."
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\VulkanSDK-Installer.exe"
          Write-Host "Installing ..."
          Start-Process -FilePath "$env:TEMP\VulkanSDK-Installer.exe" `
            -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" `
            -Wait -NoNewWindow
          $sdkPath = "C:\VulkanSDK\${ver}"
          echo "VULKAN_SDK=$sdkPath"          >> $env:GITHUB_ENV
          echo "${sdkPath}\Bin"               >> $env:GITHUB_PATH

      # ============================================================
      # Configure & Build
      # ============================================================
      # Release presets are PGO-use builds now, so they require pre-collected
      # profile data and are not suitable for clean CI runners by default.
      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (${{ matrix.preset }})
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: cmake --build --preset ${{ matrix.preset }}
